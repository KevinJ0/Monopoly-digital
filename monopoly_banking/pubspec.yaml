name: money_manager
description: Money Manager - app de banca digital P2P.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  uuid: ^4.5.3
  path_provider: ^2.1.5
  audioplayers: ^6.6.0
  confetti: 0.7.0
  flutter_animate: ^4.5.2
  google_generative_ai: ^0.4.6
  crypto: ^3.0.6

  sensors_plus: ^7.1.0
  logger: ^2.5.0
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^6.0.5
  flutter_background_service: ^5.1.0
  window_manager: ^0.5.2
  sentry_flutter: ^8.14.2


dev_dependencies:
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: 0.13.1
  flutter_native_splash: 2.4.8
  sentry_dart_plugin: ^3.4.0

sentry:
  project: flutter
  org: money-manager-flutter
  upload_sources: true
  dart_symbol_map_path: build/shorebird/obfuscation_map.json
  ignore_missing: true

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/
    - assets/fonts/
    - shorebird.yaml
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-300.ttf
          weight: 300
        - asset: assets/fonts/Fredoka-400.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-300.ttf
          weight: 300
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1A1A2E"
