name: Android Release (GitHub)

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  build-android:
    name: Build APK + AAB Android
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: monopoly_banking
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true

      - name: Restaurar keystore y key.properties desde secrets
        shell: bash
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=monopoly-release.jks" >> android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/monopoly-release.jks

      - name: Dependencias
        run: flutter pub get

      - name: Setup Shorebird
        if: ${{ env.SHOREBIRD_TOKEN != '' && hashFiles('monopoly_banking/shorebird.yaml') != '' }}
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Release Android (APK + AAB)
        if: ${{ env.SHOREBIRD_TOKEN != '' && hashFiles('monopoly_banking/shorebird.yaml') != '' }}
        uses: shorebirdtech/shorebird-release@v1
        id: shorebird-release
        with:
          platform: android
          working-directory: monopoly_banking
          flutter-version: "3.44.6"
          args: --artifact apk --build-number=${{ github.run_number }} -- --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Build APK (release)
        if: ${{ !(env.SHOREBIRD_TOKEN != '' && hashFiles('monopoly_banking/shorebird.yaml') != '') }}
        run: flutter build apk --release --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Determinar version del release
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=version: ).*' pubspec.yaml | head -1 | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Subir simbolos de depuracion a Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          dart run sentry_dart_plugin
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: com.moneymanager.app@1.0.0+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}

      - name: Subir APK y AAB como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            monopoly_banking/build/app/outputs/flutter-apk/*.apk
            monopoly_banking/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish-release:
    name: Crear GitHub Release con el APK
    runs-on: ubuntu-latest
    needs: build-android
    permissions:
      contents: write

    steps:
      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Listar artifacts
        run: ls -R artifacts

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.build-android.outputs.version }}
          name: Money Manager Android v${{ needs.build-android.outputs.version }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-apk/*.aab
          generate_release_notes: true
